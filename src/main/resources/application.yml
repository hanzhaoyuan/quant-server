server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: quant-server

  # Spring MVC 配置 (解决 Swagger 与 Spring Boot 2.6+ 的兼容性问题)
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # PostgreSQL 数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    # 请填写您的数据库连接信息
    url: jdbc:postgresql://localhost:5432/fastbull_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: fastbull_user
    password: gklz12345

    # Druid 连接池配置
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # Druid 监控配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000

  # Jackson 配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描路径
  type-aliases-package: com.quant.server.entity
  configuration:
    # 驼峰转下划线
    map-underscore-to-camel-case: true
    # 日志输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键类型 (AUTO: 数据库自增, ASSIGN_ID: 雪花算法)
      id-type: AUTO
      # 逻辑删除配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 自动填充策略
      update-strategy: NOT_NULL
      insert-strategy: NOT_NULL

# JWT 配置
jwt:
  # JWT 密钥 (请在生产环境中修改为复杂密钥)
  secret: quant-server-secret-key-2024-change-this-in-production
  # Token 有效期 (单位: 秒, 默认 7 天)
  expiration: 604800
  # Token 请求头名称
  header: Authorization
  # Token 前缀
  prefix: Bearer

# 日志配置
logging:
  level:
    root: INFO
    com.quant.server: DEBUG
    com.quant.server.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/quant-server.log
    max-size: 10MB
    max-history: 30

# Swagger 配置
springfox:
  documentation:
    swagger-ui:
      enabled: true

# 指标服务配置
indicator:
  service:

